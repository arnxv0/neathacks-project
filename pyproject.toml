[project]
name = "preflight"
version = "0.1.0"
description = "Preflight crash-tests an AI agent before launch: attack, trace, fix, prove."
authors = [
    { name = "Arnav Dewan", email = "57629464+arnxv0@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "neatlogs>=1.4.26",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlglot>=30.22.0",
    "sse-starlette>=3.5.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
preflight = "preflight.cli:app"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
