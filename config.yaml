modes:
  dev:  {seeds_per_attack: 1, replay_k: 2, max_usd: 1.0, concurrency: 3, attacks: P0}
  full: {seeds_per_attack: 3, replay_k: 5, max_usd: 8.0, concurrency: 4, attacks: P0}
guard:
  allowlist: ["localhost", "127.0.0.1", "target", "host.docker.internal"]
  rps: 4
  run_timeout_s: 120
  assessment_timeout_s: 1500
models:
  cheap:  [nova-micro, claude-haiku, nova-lite]
  strong: [claude-sonnet-4.6, claude-haiku]
  prices_per_1m:   # input, output USD
    claude-haiku: [1.0, 5.0]
    claude-sonnet-4.6: [3.0, 15.0]
    claude-opus-4.6: [15.0, 75.0]
    nova-micro: [0.035, 0.14]
    nova-lite: [0.06, 0.24]
    nova-2-lite: [0.06, 0.24]
    nova-pro: [0.8, 3.2]
ports: {target: 8100, replay_target: 8101, api: 8200, proxy: 8300, web: 3000}
fixers: {max_parallel: 3, max_retries: 2, max_turns: 60}
neatlogs:
  app_url: https://app.neatlogs.com
  target_workflow: acmesales-copilot
  preflight_workflow: preflight
